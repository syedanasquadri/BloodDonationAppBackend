name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://dummy:dummy@main.neon.tech:5432/main_db?sslmode=require"
      TEST_DATABASE_URL: "postgresql://dummy:dummy@test.neon.tech:5432/test_db?sslmode=require"
      JWT_SECRET: "ci-dummy-jwt-secret-key-for-testing-purposes"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run unit & integration tests
        run: npm test
